<h1 id="title">第一章 锈迹</h1>
<div id="content">
  <p>　　星港已经废弃了很多年，铁架上挂着锈水，一滴一滴落在积水里。</p>
  <p>　　他弯下腰，从一堆碎金属里捡起了那个东西。</p>
  <p>&nbsp;</p>
  <p>　　它很小，只有半个手掌大，表面却是温的。</p>
  <p>　　像是刚从谁的怀里拿出来。</p>
