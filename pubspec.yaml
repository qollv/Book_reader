name: novel_reader
description: A comfortable mobile novel reader with smart typesetting.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  dio: ^5.7.0
  fast_gbk: ^1.0.0
  archive: ^3.6.1
  xml: ^6.5.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  qr_flutter: ^4.1.0
  uuid: ^4.4.0
  file_picker: ^13.1.0
  # 将预编译 SQLite 库打进 APK（Maven 源），配合下方 user_defines 的 system 加载方式
  sqlite3_flutter_libs: ^0.5.32

# sqlite3 构建钩子默认从 GitHub Release 下载预编译库，受限网络下会失败；
# 改为运行时 dlopen：Android 用 sqlite3_flutter_libs 打进的 libsqlite3.so，
# Windows 测试用系统自带的 winsqlite3.dll
hooks:
  user_defines:
    sqlite3:
      source: system
      name: sqlite3
      name_windows: winsqlite3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 测试专用：在桌面环境（无 sqflite native 插件）以内存库跑数据层集成测试
  sqflite_common_ffi: ^2.3.3
  # 测试专用：path_provider 的平台接口，用于替换为测试用临时目录
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
