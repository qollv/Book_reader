name: novel_reader
description: A comfortable mobile novel reader with smart typesetting.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  dio: ^5.7.0
  archive: ^3.6.1
  xml: ^6.5.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  qr_flutter: ^4.1.0
  uuid: ^4.4.0
  file_picker: ^13.1.0
  html: ^0.15.7
  charset: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 让 sqflite 在桌面/测试环境可用，DAO 与源注册表可以脱离设备跑单测
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    # 内置示例数据源声明；用户导入的源存在数据库里，不在这里
    - assets/sources/
